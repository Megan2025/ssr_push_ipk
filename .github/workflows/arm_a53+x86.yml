name: build ssr+ arm_a53+x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
          - arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Setup custom feed for SSR+
        run: |
          mkdir -p custom_feed
          # 拉取包含最新 luci-app-ssr-plus 及 xray-core 协议组件的源码
          git clone --depth=1 https://github.com/fw876/helloworld.git custom_feed/helloworld

      - name: Build
        uses: immortalwrt/gh-action-sdk@v4.1
        env:
          ARCH: ${{ matrix.arch }}-openwrt-23.05
          FEEDNAME: custom_feed
          PACKAGES: >-
            luci-app-ssr-plus
            xray-core
            shadowsocks-rust
            chinadns-ng
            dns2socks
            dns2tcp
            tcping
            simple-obfs
            microsocks
            hysteria
          NO_DEFCONFIG: 0
          V: s

      - name: Move created packages to clean dist dir
        run: |
          mkdir -p dist
          # 提取白名单核心组件（包含界面、多语言、xray-core、ss-rust、chinadns-ng 等），排除源码包与无用系统包
          find bin/packages/ -type f -name "*.ipk" ! -name "*-src_*.ipk" | \
            grep -E "(luci-app-ssr-plus|luci-i18n-ssr-plus|xray-core|chinadns-ng|dns2socks|dns2tcp|shadowsocks-rust|shadowsocks-libev|simple-obfs|tcping|microsocks|lua-neturl|hysteria)" | \
            xargs -I {} cp -f {} dist/ || true

      - name: Collect metadata
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          echo "ARCHIVE_NAME=${{ matrix.arch }}-$COMMIT_ID" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          cat << _EOF_ > dist/PKG-INFO
          Name: ${{ env.ARCHIVE_NAME }}
          Platform: ${{ matrix.arch }}
          Package: luci-app-ssr-plus with Complete Core (XHTTP & SS-Rust)
          Full file listing:
          _EOF_
          ls -al dist/*.ipk >> dist/PKG-INFO 2>/dev/null || true
          cat dist/PKG-INFO

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            dist/*.ipk
            dist/PKG-INFOname: build ssr+ arm_a53+x86

