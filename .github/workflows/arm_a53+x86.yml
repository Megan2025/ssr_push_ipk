name: build ssr+ arm_a53+x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            out_name: aarch64_cortex-a53
            target: armsr/armv8
          - arch: x86_64
            out_name: x86_64
            target: x86/64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Prepare feeds and dependencies
        run: |
          mkdir -p custom_feed
          # 克隆 helloworld 源
          git clone --depth=1 https://github.com/fw876/helloworld.git custom_feed/helloworld
          
          # 针对 golang 依赖：直接使用 openwrt 官方更新后的 golang feed，避免 golang-bootstrap 编译崩溃
          git clone --depth=1 https://github.com/sbwml/packages_lang_golang.git custom_feed/golang

      - name: Build
        uses: immortalwrt/gh-action-sdk@v4.1
        env:
          ARCH: ${{ matrix.arch }}-openwrt-23.05
          FEEDNAME: custom_feed
          PACKAGES: luci-app-ssr-plus
          NO_DEFCONFIG: 1
          V: s

      - name: Move created packages to clean dist dir
        run: |
          mkdir -p dist
          # 严格筛选目标 IPK，杜绝无关底层包
          find bin/packages/ -type f -name "*.ipk" ! -name "*-src_*.ipk" | \
            grep -E "(luci-app-ssr-plus|luci-i18n-ssr-plus|chinadns-ng|dns2socks|dns2tcp|shadowsocks-libev|shadowsocks-rust|simple-obfs|tcping|xray-core|v2ray|trojan|lua-neturl|microsocks)" | \
            xargs -I {} cp -f {} dist/ || true

      - name: Collect metadata
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          echo "ARCHIVE_NAME=${{ matrix.out_name }}-$COMMIT_ID" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          cat << _EOF_ > dist/PKG-INFO
          Name: ${{ env.ARCHIVE_NAME }}
          Platform: ${{ matrix.out_name }}
          Package: luci-app-ssr-plus
          Full file listing:
          _EOF_
          ls -al dist/*.ipk >> dist/PKG-INFO 2>/dev/null || true
          cat dist/PKG-INFO

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            dist/*.ipk
            dist/PKG-INFO
