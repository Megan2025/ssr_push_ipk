name: build ssr+ arm_a53+x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch_name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: aarch64_cortex-a53
            arch: aarch64_generic
            pkg_arch: aarch64_generic
            xray_arch: arm64-v8a
            hy_arch: arm64
          - arch_name: x86_64
            arch: x86_64
            pkg_arch: x86_64
            xray_arch: 64
            hy_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup custom feed and Pre-apply Patches
        run: |
          mkdir -p custom_feed
          git clone --depth=1 https://github.com/fw876/helloworld.git custom_feed/helloworld

          # 清理可能触发 quilt refresh 拦截的补丁
          cd custom_feed/helloworld
          if [ -d "dns2tcp/patches" ]; then
            rm -rf dns2tcp/patches
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "pre-clean patches to bypass quilt check" || true
          cd ../..

      - name: Build SSR+ & Base Core Packages
        uses: immortalwrt/gh-action-sdk@v4.1
        env:
          ARCH: ${{ matrix.arch }}-openwrt-23.05
          FEEDNAME: custom_feed
          PACKAGES: luci-app-ssr-plus chinadns-ng dns2socks dns2tcp tcping microsocks
          V: s

      - name: Collect and Assemble All Core Packages (XHTTP & Hysteria2)
        run: |
          mkdir -p dist
          DIST_DIR="$(pwd)/dist"

          # 1. 提取 SDK 本地编译好的 SSR+ 界面、语言包及基础 C 核心
          find bin/packages/ -type f -name "*.ipk" ! -name "*-src_*.ipk" | \
            grep -E "(luci-app-ssr-plus|luci-i18n-ssr-plus|chinadns-ng|dns2socks|dns2tcp|microsocks|lua-neturl|tcping)" | \
            xargs -I {} cp -f {} dist/ || true

          # 2. 从官方源拉取预编译好的配套核心（SS-Rust, SSR, Obfs 等）
          OPKG_BASE="https://downloads.immortalwrt.org/releases/23.05.4/packages/${{ matrix.pkg_arch }}/packages"
          for pkg in $(curl -sSL "${OPKG_BASE}/Packages.gz" | zcat | grep -E "Filename: (shadowsocks-rust|shadowsocksr-libev|simple-obfs)" | awk '{print $2}'); do
            echo "正在下载官方核心依赖: $pkg"
            curl -sSL -o "dist/$(basename $pkg)" "${OPKG_BASE}/$pkg" || true
          done

          # 3. 注入支持 XHTTP 的最新 Xray-core
          mkdir -p xray_pkg/data/usr/bin xray_pkg/control
          curl -sSL -H "User-Agent: Mozilla/5.0" -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-${{ matrix.xray_arch }}.zip"
          unzip -q xray.zip -d xray_temp
          cp xray_temp/xray xray_pkg/data/usr/bin/
          chmod 755 xray_pkg/data/usr/bin/xray
          XRAY_VER=$(xray_temp/xray version 2>/dev/null | head -n 1 | awk '{print $2}')
          [ -z "$XRAY_VER" ] && XRAY_VER="26.10.29"

          echo "Package: xray-core" > xray_pkg/control/control
          echo "Version: ${XRAY_VER}-1" >> xray_pkg/control/control
          echo "Depends: libc, ca-bundle" >> xray_pkg/control/control
          echo "Architecture: ${{ matrix.pkg_arch }}" >> xray_pkg/control/control
          echo "Maintainer: XTLS" >> xray_pkg/control/control
          echo "Description: Xray with native XHTTP support" >> xray_pkg/control/control

          tar -czf xray_pkg/data.tar.gz -C xray_pkg/data .
          tar -czf xray_pkg/control.tar.gz -C xray_pkg/control .
          echo "2.0" > xray_pkg/debian-binary
          tar -czf "${DIST_DIR}/xray-core_${XRAY_VER}-1_${{ matrix.pkg_arch }}.ipk" \
            -C xray_pkg ./debian-binary ./data.tar.gz ./control.tar.gz
          rm -rf xray_pkg xray_temp xray.zip

          # 4. 注入最新原生支持 Hysteria 2 的 hysteria-core IPK
          mkdir -p hy_pkg/data/usr/bin hy_pkg/control
          HY_URL="https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-${{ matrix.hy_arch }}"
          curl -sSL -H "User-Agent: Mozilla/5.0" -o hy_pkg/data/usr/bin/hysteria "${HY_URL}"
          chmod 755 hy_pkg/data/usr/bin/hysteria
          HY_VER=$(hy_pkg/data/usr/bin/hysteria version 2>/dev/null | head -n 1 | awk '{print $3}')
          [ -z "$HY_VER" ] && HY_VER="2.5.0"

          echo "Package: hysteria" > hy_pkg/control/control
          echo "Version: ${HY_VER}-1" >> hy_pkg/control/control
          echo "Depends: libc, ca-bundle" >> hy_pkg/control/control
          echo "Architecture: ${{ matrix.pkg_arch }}" >> hy_pkg/control/control
          echo "Maintainer: apernet" >> hy_pkg/control/control
          echo "Description: Hysteria 2 core for SSR Plus" >> hy_pkg/control/control

          tar -czf hy_pkg/data.tar.gz -C hy_pkg/data .
          tar -czf hy_pkg/control.tar.gz -C hy_pkg/control .
          echo "2.0" > hy_pkg/debian-binary
          tar -czf "${DIST_DIR}/hysteria_${HY_VER}-1_${{ matrix.pkg_arch }}.ipk" \
            -C hy_pkg ./debian-binary ./data.tar.gz ./control.tar.gz
          rm -rf hy_pkg

      - name: Collect metadata
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          echo "ARCHIVE_NAME=${{ matrix.arch_name }}-$COMMIT_ID" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          echo "Name: ${{ env.ARCHIVE_NAME }}" > dist/PKG-INFO
          echo "Platform: ${{ matrix.arch_name }}" >> dist/PKG-INFO
          echo "Package: luci-app-ssr-plus with Full Cores (XHTTP & Hysteria2)" >> dist/PKG-INFO
          echo "Full file listing:" >> dist/PKG-INFO
          ls -al dist/*.ipk >> dist/PKG-INFO 2>/dev/null || true
          cat dist/PKG-INFO

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            dist/*.ipk
            dist/PKG-INFO
